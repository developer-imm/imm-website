<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found</title>
  <link rel="canonical" href="https://interactivemm.com/404.html" />
  <meta name="description" content="The page you were looking for on Interactive MM could not be found. Use the navigation to return to the homepage." />
  <meta name="robots" content="noindex, follow" />
  <meta property="og:site_name" content="Interactive MM" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Interactive MM — Page Not Found" />
  <meta property="og:description" content="The page you requested on Interactive MM is missing. Return to the homepage to explore our software studio and products." />
  <meta property="og:url" content="https://interactivemm.com/404.html" />
  <meta property="og:image" content="https://interactivemm.com/img/logo.png" />
  <meta property="og:image:alt" content="Interactive MM logo" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Interactive MM — Page Not Found" />
  <meta name="twitter:description" content="Return to Interactive MM to learn about our software services and Traction product updates." />
  <meta name="twitter:image" content="https://interactivemm.com/img/logo.png" />
  <meta name="twitter:image:alt" content="Interactive MM logo" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="/img/logo.png" type="image/png" />
</head>
<body class="bg-[#0b1020] text-white flex items-center justify-center h-screen">
  <div class="text-center">
    <h1 class="text-6xl font-bold">404</h1>
    <p class="mt-4 text-lg">Sorry, the page you’re looking for doesn’t exist.</p>
    <a href="/" class="mt-6 inline-block px-6 py-3 bg-blue-500 text-white rounded-lg">Go Home</a>
    <p class="mt-6 text-xs text-white/60" aria-hidden="true" id="build-tag" data-repo="developer-imm/imm-website">Build loading…</p>
  </div>
  <script>
    (function () {
      const buildTag = document.getElementById('build-tag');
      if (!buildTag) return;

      const applyBuildLabel = (value) => {
        buildTag.textContent = `Build ${value}`;
      };

      const fallbackBuildLabel = () => {
        applyBuildLabel('local');
      };

      fallbackBuildLabel();

      const repo = buildTag.dataset.repo;
      if (!(repo && window.fetch)) {
        return;
      }

      const endpoint = `https://api.github.com/repos/${repo}/commits?per_page=1`;
      fetch(endpoint, {
        headers: {
          Accept: 'application/vnd.github+json'
        }
      })
        .then((response) => (response.ok ? response.json() : null))
        .then((data) => {
          const latest = Array.isArray(data) ? data[0] : null;
          if (latest && latest.sha) {
            applyBuildLabel(latest.sha.slice(0, 7));
          }
        })
        .catch(() => {
          // Ignore errors; fallback already applied.
        });
    })();
  </script>
</body>
</html>
